<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #ffffff; }
      .label { font: 700 24px Arial, sans-serif; fill: #111111; }
      .text { font: 600 20px Arial, sans-serif; fill: #111111; }
      .small { font: 600 16px Arial, sans-serif; fill: #111111; }
    </style>
  </defs>
  <rect width="1400" height="750" fill="#f3f3f3" />

  <!-- Left column: scheduler-heavy -->
  <rect x="40" y="40" width="620" height="60" fill="#111111" />
  <text x="350" y="78" text-anchor="middle" class="title">Thousands of Paths</text>

  <rect x="40" y="120" width="620" height="420" fill="#e5e5e5" stroke="#c7c7c7" />
  <text x="350" y="160" text-anchor="middle" class="label">Many Small Tasks</text>

  <!-- Task grid -->
  <g fill="#585858">
    <rect x="80" y="190" width="120" height="70" rx="6" />
    <rect x="220" y="190" width="120" height="70" rx="6" />
    <rect x="360" y="190" width="120" height="70" rx="6" />
    <rect x="500" y="190" width="120" height="70" rx="6" />

    <rect x="80" y="280" width="120" height="70" rx="6" />
    <rect x="220" y="280" width="120" height="70" rx="6" />
    <rect x="360" y="280" width="120" height="70" rx="6" />
    <rect x="500" y="280" width="120" height="70" rx="6" />

    <rect x="80" y="370" width="120" height="70" rx="6" />
    <rect x="220" y="370" width="120" height="70" rx="6" />
    <rect x="360" y="370" width="120" height="70" rx="6" />
    <rect x="500" y="370" width="120" height="70" rx="6" />
  </g>

  <g class="small" fill="#ffffff" text-anchor="middle">
    <text x="140" y="232">Task</text>
    <text x="280" y="232">Task</text>
    <text x="420" y="232">Task</text>
    <text x="560" y="232">Task</text>

    <text x="140" y="322">Task</text>
    <text x="280" y="322">Task</text>
    <text x="420" y="322">Task</text>
    <text x="560" y="322">Task</text>

    <text x="140" y="412">Task</text>
    <text x="280" y="412">Task</text>
    <text x="420" y="412">Task</text>
    <text x="560" y="412">Task</text>
  </g>

  <rect x="40" y="560" width="620" height="70" fill="#1b4fdb" />
  <text x="350" y="605" text-anchor="middle" class="label" fill="#ffffff">Scheduler Orchestration</text>

  <!-- CPU row -->
  <g>
    <rect x="90" y="650" width="80" height="60" fill="#ffffff" stroke="#2b2b2b" />
    <rect x="210" y="650" width="80" height="60" fill="#ffffff" stroke="#2b2b2b" />
    <rect x="330" y="650" width="80" height="60" fill="#ffffff" stroke="#2b2b2b" />
    <rect x="450" y="650" width="80" height="60" fill="#ffffff" stroke="#2b2b2b" />
    <rect x="570" y="650" width="80" height="60" fill="#ffffff" stroke="#2b2b2b" />
  </g>
  <g class="small" text-anchor="middle">
    <text x="130" y="687">CPU</text>
    <text x="250" y="687">CPU</text>
    <text x="370" y="687">CPU</text>
    <text x="490" y="687">CPU</text>
    <text x="610" y="687">CPU</text>
  </g>

  <!-- Right column: CUDA batching -->
  <rect x="740" y="40" width="620" height="60" fill="#111111" />
  <text x="1050" y="78" text-anchor="middle" class="title">Thousands of Paths</text>

  <rect x="740" y="120" width="480" height="300" fill="#66a94a" stroke="#4b7f39" />
  <text x="980" y="280" text-anchor="middle" class="label" fill="#111111">Batched Monte Carlo Job</text>

  <rect x="740" y="440" width="480" height="70" fill="#32d133" stroke="#21a123" />
  <text x="980" y="485" text-anchor="middle" class="label" fill="#111111">CUDA Library</text>

  <rect x="1240" y="120" width="120" height="390" fill="#ffffff" stroke="#909090" />
  <text x="1300" y="250" text-anchor="middle" class="small">Minimal</text>
  <text x="1300" y="275" text-anchor="middle" class="small">Scheduling</text>
  <text x="1300" y="305" text-anchor="middle" class="small">(MPI Op)</text>

  <rect x="740" y="560" width="620" height="70" fill="#e11e1e" />
  <text x="1050" y="605" text-anchor="middle" class="label" fill="#ffffff">Kubernetes / OpenShift</text>

  <!-- GPU row -->
  <g>
    <rect x="790" y="650" width="90" height="60" fill="#e8f5e9" stroke="#2b2b2b" />
    <rect x="905" y="650" width="90" height="60" fill="#e8f5e9" stroke="#2b2b2b" />
    <rect x="1020" y="650" width="90" height="60" fill="#e8f5e9" stroke="#2b2b2b" />
    <rect x="1135" y="650" width="90" height="60" fill="#e8f5e9" stroke="#2b2b2b" />
    <rect x="1250" y="650" width="90" height="60" fill="#e8f5e9" stroke="#2b2b2b" />
  </g>
  <g class="small" text-anchor="middle">
    <text x="835" y="687">GPU</text>
    <text x="950" y="687">GPU</text>
    <text x="1065" y="687">GPU</text>
    <text x="1180" y="687">GPU</text>
    <text x="1295" y="687">GPU</text>
  </g>

  <text x="350" y="30" text-anchor="middle" class="small">Per-task scheduling overhead</text>
  <text x="1050" y="30" text-anchor="middle" class="small">CUDA batches paths into one job</text>
</svg>
